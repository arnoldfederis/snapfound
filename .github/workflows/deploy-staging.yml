name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [ staging ]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run turbo check-types

      - name: Test
        run: bun run test
        continue-on-error: true

  build-site:
    name: Build site
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/site/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/snapfound-site:staging
            ghcr.io/${{ steps.vars.outputs.owner }}/snapfound-site:staging-${{ github.sha }}
          cache-from: type=gha,scope=snapfound-site-staging
          cache-to: type=gha,mode=max,scope=snapfound-site-staging

  deploy:
    name: Deploy Staging
    needs: [ build-site ]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Redeploy compose
        run: |
          curl -f -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.redeploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}", "title": "Deploy ${{ github.sha }}", "description": "Automated deploy from GitHub Actions"}'
