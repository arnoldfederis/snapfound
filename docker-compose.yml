services:
  site:
    image: ghcr.io/proghublabs/snapfound-site:staging
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:6001:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=staging
      - APP_ENV=staging
      - APP_MODULE=site
      - PORT=4000
      - HOST=0.0.0.0
    healthcheck:
      test: [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
